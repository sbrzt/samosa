[project]
name = "samosa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6",
    "owlrl>=7.6.2",
    "pyyaml>=6.0.3",
    "rdflib>=7.5.0",
]

[project.optional-dependencies]
api = [
    "fastapi[standard]>=0.115",
]
docs = [
    "oc-lode>=2.1.1",
]

[project.scripts]
samosa = "main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "api"]
packages = ["scripts"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest probes module attributes during collection; rdflib's closed namespaces (XSD) warn about it
filterwarnings = ["ignore:Code. _mock_name is not defined in namespace:UserWarning"]
